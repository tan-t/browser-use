version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}  # Will use value from .env file or empty if not set
    ports:
      - "8000:8000"  # Map container port 8000 to host port 8000
